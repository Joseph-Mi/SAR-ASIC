name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Must match docs/tool-versions.md. apt's verilator is far older than this,
  # which is why it is built from the tag instead of installed.
  VERILATOR_VERSION: v5.050

jobs:
  digital:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-${{ runner.os }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex bison ccache \
            libgoogle-perftools-dev numactl perl-doc libfl2 libfl-dev zlib1g zlib1g-dev
          git clone --depth 1 --branch "$VERILATOR_VERSION" \
            https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          sudo make install

      - name: Check Verilator version
        run: |
          echo "/opt/verilator/bin" >> "$GITHUB_PATH"
          /opt/verilator/bin/verilator --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Verify
        run: make verify

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-results
          path: build/sim/**/results.xml
          if-no-files-found: ignore
