name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job reads the tree and uploads an artifact, nothing more.
permissions:
  contents: read

# A newer push to the same ref makes the older run irrelevant. Cancel it rather
# than paying for a toolchain build whose result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digital:
    runs-on: ubuntu-latest
    # A wedged toolchain build would otherwise burn the default 6h.
    timeout-minutes: 60

    # Tools install under ~/tools, never /opt. /opt is root-owned on hosted
    # runners, so a root-owned install cannot be restored by actions/cache,
    # which runs unprivileged -- the cache silently misses and every run
    # rebuilds from source. A user-owned prefix also means no sudo outside apt,
    # and keeps the tools out of the checkout where ruff would scan them.
    steps:
      - uses: actions/checkout@v4

      # versions.env is the single source of truth. Every tool version below
      # comes from it -- never hardcode one here.
      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Unconditional, not inside a cache-miss branch: a restored Yosys binary
      # still links libreadline/libtcl at run time, and missing those surfaces
      # as "error while loading shared libraries" from check-tools rather than
      # as a version mismatch.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang bison flex gawk pkg-config \
            libreadline-dev tcl-dev libffi-dev zlib1g-dev \
            git help2man perl perl-doc python3 autoconf ccache \
            libgoogle-perftools-dev numactl libfl2 libfl-dev

      # ---- Verilator: source only, so build and cache --------------------
      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/tools/verilator
          key: verilator-v${{ env.VERILATOR_VERSION }}-${{ runner.os }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v$VERILATOR_VERSION" \
            https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/tools/verilator"
          make -j"$(nproc)"
          make install

      # ---- Yosys: source only, so build and cache the same way -----------
      - name: Cache Yosys
        id: cache-yosys
        uses: actions/cache@v4
        with:
          path: ~/tools/yosys
          key: yosys-v${{ env.YOSYS_VERSION }}-${{ runner.os }}

      - name: Build Yosys
        if: steps.cache-yosys.outputs.cache-hit != 'true'
        run: |
          # Two things about this tarball, both easy to get wrong:
          #   - it has NO top-level directory, so no --strip-components here
          #     (Verible's tarball is the opposite; check before changing either)
          #   - Yosys is CMake-only; there is no Makefile at the archive root
          mkdir -p /tmp/yosys
          curl -fsSL "https://github.com/YosysHQ/yosys/releases/download/v$YOSYS_VERSION/yosys.tar.gz" \
            | tar -xz -C /tmp/yosys
          cmake -S /tmp/yosys -B /tmp/yosys/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/tools/yosys"
          cmake --build /tmp/yosys/build -j"$(nproc)"
          cmake --install /tmp/yosys/build

      # ---- Verible: prebuilt static binary, ~16 MB. Cheaper to fetch than
      # to cache, so it is fetched every run.
      - name: Install Verible
        run: |
          mkdir -p "$HOME/tools/verible"
          curl -fsSL "https://github.com/chipsalliance/verible/releases/download/$VERIBLE_VERSION/verible-$VERIBLE_VERSION-linux-static-x86_64.tar.gz" \
            | tar -xz -C "$HOME/tools/verible" --strip-components=1

      # One step owns PATH, so reordering cannot silently drop a tool and let
      # a Makefile guard skip the check that needed it.
      - name: Put tools on PATH
        run: |
          for t in verilator yosys verible; do
            echo "$HOME/tools/$t/bin" >> "$GITHUB_PATH"
          done

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ahead of the checks that depend on these tools, so a version skew
      # reports as a version skew and not as a mysterious lint diff.
      - name: Check tool versions
        run: make check-tools

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Verify
        run: make verify

      # The run's own page then answers where the time went, so finding out
      # costs nobody a download. It reads the reports the levels wrote, so a
      # level that failed is still counted.
      - name: Summarise the run
        if: always()
        run: python3 scripts/verify-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-results
          path: |
            build/sim/**/results.xml
            build/verify/*.xml
          if-no-files-found: ignore

  # The analog half and the closed loop need ngspice, Verilator, the element
  # glue ngspice ships and the sky130 models together -- exactly the pinned tool
  # image. They run inside it, and a test that finds a tool missing fails here
  # instead of skipping: this is the environment that is meant to have them all.
  analog:
    runs-on: ubuntu-latest
    # The levels below are measured in tens of minutes each, so the work this
    # job does is most of two hours before anything goes wrong. The limit is
    # above the sum of the steps' own, so that one level wedging trips the
    # step that wedged; this is what is left to bound the bill when several
    # do at once.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      # The image is larger than a hosted runner's free disk. The runner ships
      # toolchains this job never uses; removing them makes the room.
      - name: Make room for the tool image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
          free -m

      - name: Pull the pinned tool image
        run: docker pull "hpretl/iic-osic-tools:${OSIC_TOOLS_TAG}"

      # The tests run against the versions requirements.txt pins, which the base
      # image does not ship. Building the same layer the container uses locally
      # is what keeps one Python stack across both.
      - name: Build the image layer
        run: make image

      # ngspice checks free memory before allocating its output buffer and exits
      # if it is short. Unpacking a ~20 GB image leaves the runner with almost
      # none free -- reclaimable, as page cache, but not free, and ngspice reads
      # only the latter. Reclaim it, and print the figure either side of the
      # pull so a recurrence is one line of log rather than a run to reproduce.
      - name: Reclaim the pull's page cache
        run: |
          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
          free -m

      # Each level is its own step, so the run itself says where the time
      # goes and which one it is in: a single step covering all of them
      # reports one duration for most of an hour, and a step still running is
      # the only sign of progress a collapsed log gives. The proofs and the
      # figures run in this job rather than the other because the solver and
      # the drawing library ship in this image, and because a skip is a
      # failure here -- a proof that quietly did not run is worth less than no
      # proof at all, and a figure script is the one kind of code nobody runs
      # between writing it and wanting it. Both are seconds; the ordering just
      # puts the cheap checks first.
      #
      # Each step's timeout sits above the measured length of that level with
      # room for a slower runner, and far enough under the job's that any one
      # level wedging trips its own step rather than the job: the failure then
      # names the level, and the summary and the reports are still written.
      # The job's own limit is left as what it is, a bound on the bill when
      # more than one thing goes wrong at once.
      - name: Tool locations and PDK selection
        run: sh scripts/in-image.sh bash -c 'echo "PDK_ROOT=$PDK_ROOT PDK=$PDK"; for t in ngspice verilator sby python3; do command -v "$t"; done'

      # First because it is the cheapest thing here that can be wrong, and
      # because the sheet is edited by hand: a wire dragged off a pin is a
      # two-second failure that would otherwise surface an hour in.
      - name: Schematic
        timeout-minutes: 5
        run: sh scripts/in-image.sh make verify-schematic PYTHON=python3

      - name: Figures
        timeout-minutes: 10
        run: sh scripts/in-image.sh make figures PYTHON=python3

      - name: Proofs
        timeout-minutes: 10
        run: sh scripts/in-image.sh make verify-formal PYTHON=python3

      - name: Analog harness
        timeout-minutes: 80
        run: sh scripts/in-image.sh make verify-analog PYTHON=python3

      - name: Closed loop
        timeout-minutes: 60
        run: sh scripts/in-image.sh make verify-integration PYTHON=python3

      # The run's own page then answers where the time went, so finding out
      # costs nobody a download. It reads the reports the levels wrote, so a
      # level that failed is still counted.
      - name: Summarise the run
        if: always()
        run: python3 scripts/verify-summary.py >> "$GITHUB_STEP_SUMMARY"

      # What each level spent its time on, per test, machine-readable. A run
      # this long is worth comparing against the next one, and the log scrolls
      # past in a browser tab while this does not.
      - name: Upload the verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analog-reports
          path: build/verify/*.xml
          if-no-files-found: ignore
