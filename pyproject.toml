# Tool configuration only. This repo is not a Python package -- there is
# nothing to build or install. Dependencies live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["hdl/reference", "hdl/verification", "model"]
pythonpath = ["hdl/verification", "hdl/reference", "model"]
python_files = ["test_*.py"]
addopts = "-ra"

# No markers: the Makefile selects levels by path (make verify-unit, etc.),
# so a second parallel taxonomy would only drift.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tb_common", "sar", "metrics"]
