# Tool configuration only. This repo is not a Python package -- there is
# nothing to build or install. Dependencies live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests", "tech", "figures", "reference", "model", "studies", "sim", "hdl/verification", "layout"]
pythonpath = ["tech", "figures", "reference", "model", "studies", "sim", "hdl/verification", "layout"]
python_files = ["test_*.py"]
addopts = "-ra"

# The heartbeat a circuit run prints while it works, shown by the levels that
# ask for it. Wall clock rather than elapsed: it is read against the timestamps
# of whatever else was happening, often long after the run.
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

# No markers: the Makefile selects levels by path (make verify-unit, etc.),
# so a second parallel taxonomy would only drift.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tb_common", "sar", "metrics", "mismatch", "yield_study", "protocol", "dynamic", "plots", "tools", "interface", "noise_study", "ngspice", "analog", "bench", "settling", "sweep", "common_mode", "sky130", "tinytapeout", "devices", "injection", "cosim", "loop", "measure", "study_points", "show", "pins", "readout", "registers", "spi", "regmap", "tick", "start", "view", "junction", "spectrum", "sampling", "power", "timing", "house", "diagrams", "noise", "probe", "comparator", "latch", "strongarm", "template", "submission", "offset", "schematic", "sheet", "cap_array", "phase_gen", "unit_study", "circuit_plots", "corner_study", "show_phases", "placement_study", "array_place", "array_gds", "array_geometry", "array_bottom", "array_check", "threshold_study"]
